            You can contact me directly at <a href="mailto:c6pham@ucsd.edu">c6pham@ucsd.edu</a> or through this form:

        <form>
            <fieldset>
                <legend>Contact Me</legend>
                <label for="name">Full Name: <span class="required-indicator">*</span></label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email: <span class="required-indicator">*</span></label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message: <span class="required-indicator">*</span></label>
                <textarea id="message" name="message" maxlength="500" required></textarea>

                <button type="submit">Submit</button>
            </fieldset>

            <output id="error-output" class="output"></output>
            <output id="info-output" class="output"></output>
        </form>
